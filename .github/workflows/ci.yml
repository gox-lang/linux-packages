name: Linux packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare packaging tools
        run: docker build -t gox-linux-packager -f packaging/Dockerfile .
      - name: Package the official release
        run: |
          mkdir -p dist
          for revision in 1 2; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
              -e GOX_PACKAGE_OUTPUT=/out \
              gox-linux-packager 0.1.3 '${{ matrix.arch }}' "$revision"
          done
      - name: Test Debian
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/checks:/checks:ro" \
            debian:12 bash /checks/install.sh deb 0.1.3 '${{ matrix.arch }}'
      - name: Test Ubuntu
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/checks:/checks:ro" \
            ubuntu:24.04 bash /checks/install.sh deb 0.1.3 '${{ matrix.arch }}'
      - name: Test Fedora
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/checks:/checks:ro" \
            fedora:43 bash /checks/install.sh rpm 0.1.3 '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-packages-${{ matrix.arch }}
          path: |
            dist/*-1_*.deb
            dist/*-1.*.rpm
            dist/checksums-*-1.sha256
          retention-days: 7
  signatures:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-packages-*
          path: dist
          merge-multiple: true
      - run: docker build -t gox-linux-packager -f packaging/Dockerfile .
      - name: Test signed repository snapshots with a disposable key
        run: |
          mkdir -p fixtures
          docker run --rm --entrypoint bash -v "$PWD:/src:ro" -v "$PWD/fixtures:/fixtures" \
            gox-linux-packager /src/checks/signatures.sh /src/dist /fixtures/repository
      - name: Install through signed APT and DNF repositories
        run: |
          docker run --rm -v "$PWD/fixtures/repository:/repository:ro" -v "$PWD/checks:/checks:ro" \
            debian:12 bash /checks/repository-client.sh deb
          docker run --rm -v "$PWD/fixtures/repository:/repository:ro" -v "$PWD/checks:/checks:ro" \
            fedora:43 bash /checks/repository-client.sh rpm
