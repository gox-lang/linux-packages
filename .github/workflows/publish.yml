name: Publish Linux repositories
run-name: Linux ${{ inputs.version }} / ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published GOX version (empty selects latest)
        type: string
        default: ''
      request_id:
        description: Distribution run identifier
        type: string
        default: manual
permissions:
  contents: read
concurrency:
  group: linux-repository-publication
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release
        uses: gox-lang/server/.github/actions/release-info@main
        with:
          version: ${{ inputs.version }}
  validate:
    needs: resolve
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
  sign:
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    environment: package-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add approved release
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if ! grep -Fxq "$VERSION 1" packaging/releases.txt; then
            printf '%s 1\n' "$VERSION" >> packaging/releases.txt
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-packages-*
          path: candidates
          merge-multiple: true
      - name: Collect approved packages, preserving published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p approved
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > released-tags.txt
          while read -r version revision extra; do
            [[ -z "$version" || "$version" == \#* ]] && continue
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$revision" =~ ^[1-9][0-9]*$ && -z "$extra" ]]
            tag="v$version-$revision"
            if grep -Fxq "$tag" released-tags.txt; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --pattern '*.rpm' --pattern SHA256SUMS --dir "retained/$tag"
              (cd "retained/$tag" && sha256sum -c SHA256SUMS)
              cp "retained/$tag/"*.deb "retained/$tag/"*.rpm approved/
            else
              for arch in amd64 arm64; do cp "candidates/gox-server_${version}-${revision}_${arch}.deb" approved/; done
              for arch in x86_64 aarch64; do cp "candidates/gox-server-${version}-${revision}.${arch}.rpm" approved/; done
            fi
          done < packaging/releases.txt
      - run: docker build -t gox-linux-packager -f packaging/Dockerfile .
      - name: Sign complete repository snapshot
        env:
          GOX_SIGNING_KEY: ${{ secrets.GOX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GOX_SIGNING_FINGERPRINT=$(cat packaging/signing-fingerprint.txt)
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "$GOX_SIGNING_KEY" > "$keydir/signing.asc"
          mkdir -p output
          docker run --rm --entrypoint bash -e GOX_SIGNING_FINGERPRINT \
            -v "$keydir:/keys:ro" -v "$PWD:/src:ro" -v "$PWD/output:/output" \
            gox-linux-packager -c '
              set -euo pipefail
              export GNUPGHOME=$(mktemp -d)
              trap '\''rm -rf "$GNUPGHOME"'\'' EXIT
              gpg --batch --import /keys/signing.asc
              bash /src/packaging/repository.sh /src/approved /output/site
              gpgv --keyring /output/site/gox-archive-keyring.gpg /output/site/apt/dists/stable/InRelease
            '
      - name: Verify signed packages with real clients
        run: |
          docker run --rm -v "$PWD/output/site:/repository:ro" -v "$PWD/checks:/checks:ro" debian:12 bash /checks/repository-client.sh deb "${{ needs.resolve.outputs.version }}"
          docker run --rm -v "$PWD/output/site:/repository:ro" -v "$PWD/checks:/checks:ro" fedora:43 bash /checks/repository-client.sh rpm "${{ needs.resolve.outputs.version }}"
      - name: Archive immutable packages in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r version revision extra; do
            [[ -z "$version" || "$version" == \#* ]] && continue
            tag="v$version-$revision"
            grep -Fxq "$tag" released-tags.txt && continue
            mkdir -p "release/$tag"
            cp output/site/apt/pool/main/gox-server_"$version-$revision"_*.deb "release/$tag/"
            cp output/site/rpm/*/Packages/gox-server-"$version-$revision".*.rpm "release/$tag/"
            (cd "release/$tag" && sha256sum *.deb *.rpm > SHA256SUMS)
            gh release create "$tag" "release/$tag/"* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --latest=false --title "GOX $version — Linux packages revision $revision" \
              --notes 'Official GOX binaries packaged for APT and DNF. RPM packages are signed. Use the signed repositories for package-manager installation and updates.'
          done < packaging/releases.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/site
  deploy:
    needs: [resolve, sign]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gox-lang/server/.github/actions/release-info@main
        with:
          version: ${{ needs.resolve.outputs.version }}
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-public:
    needs: [resolve, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify anonymous signed installation
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          export GOX_SIGNING_FINGERPRINT=$(cat packaging/signing-fingerprint.txt)
          docker run --rm -e GOX_SIGNING_FINGERPRINT -e GOX_REPOSITORY_URL=https://packages.gox-lang.dev -v "$PWD/checks:/checks:ro" debian:12 bash /checks/repository-client.sh deb "$VERSION"
          docker run --rm -e GOX_SIGNING_FINGERPRINT -e GOX_REPOSITORY_URL=https://packages.gox-lang.dev -v "$PWD/checks:/checks:ro" fedora:43 bash /checks/repository-client.sh rpm "$VERSION"
  record:
    needs: [resolve, verify-public]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record published release
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if ! grep -Fxq "$VERSION 1" packaging/releases.txt; then
            printf '%s 1\n' "$VERSION" >> packaging/releases.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/releases.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish GOX $VERSION Linux packages"
            git push origin HEAD:main
          fi
          echo "Signed APT/RPM repositories published and verified for GOX $VERSION." >> "$GITHUB_STEP_SUMMARY"
